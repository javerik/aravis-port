[package]
name = "aravis-port-device"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "GVCP device client, feature bridge, and heartbeat for aravis-port"

[dependencies]
aravis-port-core.workspace = true
aravis-port-genicam.workspace = true
log.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Path-only (no version): these are workspace-internal test fixtures, and aravis-port-stream's
# own dev-dependencies include this crate, so a versioned dependency here would deadlock
# publishing (each side would need the other already on crates.io first). Cargo drops path-only
# dev-dependencies from the published manifest, which is fine — published consumers never build
# this crate's own test/example targets.
aravis-port-fakecamera = { path = "../aravis-port-fakecamera" }
aravis-port-stream = { path = "../aravis-port-stream" }
env_logger.workspace = true
