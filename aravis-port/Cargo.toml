[package]
name = "aravis-port"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Pure-Rust GigE Vision (GEV) camera control and streaming"

[dependencies]
aravis-port-core.workspace = true
aravis-port-genicam.workspace = true
aravis-port-device.workspace = true
aravis-port-stream.workspace = true
log.workspace = true

[dev-dependencies]
# Path-only (no version): a workspace-internal test fixture only, not needed by consumers of the
# published crate. See the matching comment in aravis-port-device/Cargo.toml for why this pattern
# is used consistently for these test-only cross-crate dependencies.
aravis-port-fakecamera = { path = "../aravis-port-fakecamera" }
env_logger.workspace = true

# Runs only when given `--serial <SN>` of a camera on the network; see the file's header comment.
# Uses its own runner because libtest rejects unknown arguments.
[[test]]
name = "live_cam_integration_tests"
path = "tests/live_cam_integration_tests.rs"
harness = false
